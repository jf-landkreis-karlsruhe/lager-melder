name: Build and publish
on:
  push:
    branches: [main]
    tags: [deploy]
  pull_request:

jobs:
  frontend-checks:
    name: Frontend - Lint, format, type-check, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint:check
      - run: npm run format:check
      - run: npm run type-check
      - run: npm run test:unit:run

  frontend-e2e:
    name: Frontend - Playwright E2E and visual tests
    runs-on: ubuntu-latest
    # same image as used for the screenshot baselines (npm run test:e2e:update-screenshots)
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright test
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  build-and-push-backend:
    name: Backend - Build, containerize and push
    # run only when code is compiling and tests are passing
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin" # See 'Supported distributions' for available options
          java-version: "25"
          cache: "gradle"
      - name: Install dependencies
        run: ./gradlew dependencies
        working-directory: ./backend
      - name: Lint, static analysis and tests
        # spotlessCheck (ktlint), detekt, unit/integration/architecture tests (Testcontainers), JaCoCo
        run: ./gradlew check
        working-directory: ./backend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-reports
          path: |
            backend/build/reports/
            backend/build/test-results/
          retention-days: 7
      - name: Build java
        run: ./gradlew assemble
        working-directory: ./backend
      - name: Extract branch name
        shell: bash
        run: echo "branch=$(echo ${GITHUB_REF##*/})" >> $GITHUB_OUTPUT
        id: extract_branch
        working-directory: ./backend
      - name: Login to DockerHub
        uses: docker/login-action@v3
        if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/tags/deploy' }}
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Deploy
        run: ./gradlew jib -Djib.to.tags=${{ steps.extract_branch.outputs.branch }}-${{ github.run_id }}
        if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/tags/deploy' }}
        working-directory: ./backend

  build-and-push-frontend:
    name: Frontend - Build, containerize and push
    needs: [frontend-checks, frontend-e2e]
    # run only when code is compiling and tests are passing
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm install
        working-directory: ./frontend
      - name: Run build
        run: npm run build
        working-directory: ./frontend
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Extract branch name
        shell: bash
        run: echo "branch=$(echo ${GITHUB_REF##*/})" >> $GITHUB_OUTPUT
        id: extract_branch
        working-directory: ./backend
      - name: Login to DockerHub
        uses: docker/login-action@v3
        if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/tags/deploy' }}
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v5
        if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/tags/deploy' }}
        with:
          push: true
          tags: kordondev/lager-melder-frontend:${{ steps.extract_branch.outputs.branch }}-${{ github.run_id }}
          file: ./frontend/Dockerfile
          context: ./frontend
