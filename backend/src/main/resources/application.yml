spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      jakarta:
        persistence:
          jdbc:
            url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/lager_melder
            user: ${spring.datasource.username}
            password: ${spring.datasource.password}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/lager_melder
  liquibase:
    change-log: classpath:db/changelog-main.xml

  mail:
    port: 587
    debug: false
    from: test@spam.com
    host: h
    username: u
    password: p
logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
server:
  error:
    include-message: always
    include-binding-errors: always
  servlet:
    context-path: /api
